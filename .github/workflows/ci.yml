name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install -e . pytest
      - name: Compile (bytecode sanity)
        run: python -m compileall -q src/monstah
      - name: Tests (offline)
        run: python -m pytest tests/ -q
