[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monstah"
version = "0.1.0"
description = "Machine-readable world model: constrained simulation, event discovery, evidence reconstruction, media generation"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "httpx>=0.25",
    "duckdb>=1.0",
    "pyarrow",
    "polars>=0.20",
    "numpy>=1.26",
    "boto3>=1.34",
    "esper>=3.7",
    "psycopg[binary]>=3.1",
    "typing-extensions",
]

[project.scripts]
monstah = "monstah.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["monstah*", "channels*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
